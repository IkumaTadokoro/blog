name: check
on:
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "src/**"
      - "public/**"
      - "wrangler.jsonc"
      - ".github/workflows/*.yml"
      - ".github/actions/**"
  push:
    branches: [main]
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "src/**"
      - "public/**"
      - "wrangler.jsonc"
      - ".github/workflows/*.yml"
      - ".github/actions/**"
  workflow_dispatch:
    inputs:
      with_timeline:
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - name: lint
        run: pnpm check
      # - name: unit-test
      #   run: pnpm test
  actions-timeline:
    runs-on: ubuntu-latest
    needs: [check]
    permissions:
      actions: read
    steps:
      - uses: Kesin11/actions-timeline@57fc93f20c6da7fbc14063c6d24a2a5627c799ad # v3.2.0
