name: check
on:
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "src/**"
      - "public/**"
      - "wrangler.jsonc"
      - ".github/workflows/*.yml"
      - ".github/actions/**"
  push:
    branches: [main]
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "src/**"
      - "public/**"
      - "wrangler.jsonc"
      - ".github/workflows/*.yml"
      - ".github/actions/**"
  workflow_dispatch:
    inputs:
      with_timeline:
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - name: lint
        run: pnpm check
      # - name: unit-test
      #   run: pnpm test
  actions-timeline:
    runs-on: ubuntu-latest
    needs: [check]
    permissions:
      actions: read
    steps:
      - uses: Kesin11/actions-timeline@7c7e0821d38f27460f4a71ef874a1c8cf23602e4 # v2.2.6
